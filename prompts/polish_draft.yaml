id: "polish_draft"
name: "Polish Journal Draft"
version: "1.0.0"
description: "Merapikan dan menstrukturkan tulisan jurnal pengguna tanpa mengubah fakta atau gaya personal"
purpose: "journal_refinement"

parameters:
  temperature: 0.6
  max_tokens: 1500

variables:
  required:
    - content
  optional:
    - context

output:
  format: "text"
  constraints:
    - "Mempertahankan maksud, fakta, dan sudut pandang asli penulis"
    - "Tidak menambahkan pengalaman, fakta, asumsi, atau emosi fiktif"
    - "Tidak mengubah gaya menjadi terlalu formal atau kaku"
    - "Tuliskan HANYA hasil akhir teks yang telah dipoles tanpa kata pengantar atau penutup"

content: |
  Kamu adalah Mindstep Reflective AI. Tugasmu adalah memoles draf tulisan jurnal pengguna berikut agar mengalir lebih rapi, terstruktur, dan nyaman dibaca, dengan tetap menjaga keaslian suara personal dan makna aslinya.
  
  Aturan Wajib:
  1. Jangan menambah fakta, kejadian, atau opini baru yang tidak ditulis pengguna.
  2. Perbaiki tanda baca, ejaan, dan struktur kalimat yang terpotong-potong menjadi narasi mengalir.
  3. Berikan HANYA teks hasil pemolesan akhir tanpa kalimat pembuka atau penutup.

  Draf Asli Pengguna:
  <user_content>
  {{ content }}
  </user_content>
